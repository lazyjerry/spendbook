<div class="card-grid"><section class="card accent-coral is-roomy is-wide" aria-labelledby="range-title"><div class="card-heading">
  <span class="index-badge" aria-hidden="true">01</span>
  <div><h2 id="range-title">範圍與幣別</h2><p>不同幣別分開統計，不做匯率換算</p></div>
</div>
<form class="panel" id="range-form"><div class="stack"><fieldset class="segmented app-views">
  <legend class="visually-hidden">快速範圍</legend>
  <label><input type="radio" name="range" value="month" checked><span>本月</span></label>
  <label><input type="radio" name="range" value="last-month"><span>上月</span></label>
  <label><input type="radio" name="range" value="90"><span>近 90 天</span></label>
  <label><input type="radio" name="range" value="year"><span>今年</span></label>
  <label><input type="radio" name="range" value="all"><span>全部</span></label>
</fieldset>
<div class="field-row"><div class="field">
  <label for="range-from">開始日期</label>
  <input id="range-from" class="num app-date" type="date">
</div><div class="field">
  <label for="range-to">結束日期</label>
  <input id="range-to" class="num app-date" type="date">
</div></div>
<div class="field">
  <label for="stats-currency">幣別</label>
  <select id="stats-currency" aria-describedby="stats-currency-hint"></select>
  <p class="hint" id="stats-currency-hint">只列出這段範圍內用過的幣別</p>
</div>
<button class="btn is-block" type="submit" id="range-btn">套用日期<span class="btn-arrow" aria-hidden="true">→</span></button>
<p class="status" id="stats-status" role="status"></p></div></form></section>
<section class="card accent-blue is-roomy is-wide" aria-labelledby="overview-title"><div class="card-heading">
  <span class="index-badge" aria-hidden="true">02</span>
  <div><h2 id="overview-title">總覽</h2><p id="overview-range">範圍內的筆數與花費</p></div>
</div>
<dl class="stats" id="kpi" aria-live="polite">
  <div class="stat is-total"><dt>總花費</dt><dd>—</dd></div>
  <div class="stat"><dt>筆數</dt><dd>—</dd></div>
  <div class="stat"><dt>平均每筆</dt><dd>—</dd></div>
  <div class="stat"><dt>平均每天</dt><dd>—</dd></div>
  <div class="stat"><dt>有花錢的天數</dt><dd>—</dd></div>
  <div class="stat"><dt>每筆中位數</dt><dd>—</dd></div>
  <div class="stat"><dt>最大一筆</dt><dd>—</dd></div>
</dl></section>
<section class="card accent-violet is-roomy is-wide" aria-labelledby="trend-title"><div class="card-heading">
  <span class="index-badge" aria-hidden="true">03</span>
  <div><h2 id="trend-title">花費走勢</h2><p id="trend-sub">大筆的錢落在哪幾天</p></div>
</div>
<div class="stack"><div class="app-chart" id="trend-chart"></div>
<details class="app-chart-data"><summary>看數字表</summary><div id="trend-table"></div></details></div></section>
<section class="card accent-green is-roomy" aria-labelledby="weekday-title"><div class="card-heading">
  <span class="index-badge" aria-hidden="true">04</span>
  <div><h2 id="weekday-title">星期幾花最多</h2><p>各星期的花費合計</p></div>
</div>
<div class="app-chart" id="weekday-chart"></div></section>
<section class="card accent-blue is-roomy" aria-labelledby="hour-title"><div class="card-heading">
  <span class="index-badge" aria-hidden="true">05</span>
  <div><h2 id="hour-title">什麼時段花最多</h2><p>依紀錄的時間分成六個時段</p></div>
</div>
<div class="app-chart" id="hour-chart"></div></section>
<section class="card accent-coral is-roomy is-wide" aria-labelledby="top-title"><div class="card-heading">
  <span class="index-badge" aria-hidden="true">06</span>
  <div><h2 id="top-title">最大的 10 筆</h2><p>這段時間金額最高的事，點標題可以修改</p></div>
</div>
<ol class="app-rank" id="top-list"></ol></section></div>
