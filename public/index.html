<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>紀錄｜花錢事件簿</title>
<meta name="description" content="花錢事件簿：大筆的錢、重要的事，記一筆">
<meta name="robots" content="noindex">
<script>if (typeof HTMLDialogElement === "function") document.documentElement.classList.add("has-dialog");</script>
<link rel="stylesheet" href="jerry-ui.css">
<link rel="stylesheet" href="app.css">
<script src="jerry-ui.js" defer></script>
<script type="module" src="js/list.js"></script>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f5f3ed">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="花錢事件簿">
<script type="module" src="js/pwa.js"></script>
</head>
<body>
<a class="skip-link" href="#main">跳到主要內容</a>
<div class="wrap is-wide">
<header class="top">
  <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">錢</span>花錢事件簿</a>
  <div class="top-end"><button class="btn is-sm secondary" type="button" id="refresh-btn">重新整理</button><button class="btn is-sm secondary" type="button" id="logout-btn">登出</button></div>
</header>
<header class="masthead">
  <p class="eyebrow">BIG SPENDING LOG</p>
  <div class="masthead-grid">
    <h1><span>花大錢</span><em>事件簿</em></h1>
    <p class="lede">大筆的錢、重要的事，一筆筆留下來。</p>
  </div>
</header>
<main id="main">
<div class="stack"><nav class="chips" aria-label="頁面">
  <a class="chip" href="/" aria-current="page">紀錄</a>
  <a class="chip" href="/edit">新增</a>
  <a class="chip" href="/stats">統計</a>
  <a class="chip" href="/share">分享</a>
  <a class="chip" href="/settings">設定</a>
</nav>
<div class="card-grid"><section class="card accent-coral is-roomy is-wide" aria-labelledby="add-title"><div class="card-heading">
  <span class="index-badge" aria-hidden="true">01</span>
  <div><h2 id="add-title">記下一筆大的</h2><p>金額大或對你重要的才記，日常小額不必進來</p></div>
</div>
<div class="actions"><a class="btn" href="/edit">新增紀錄</a></div></section>
<section class="card accent-blue is-roomy is-wide" aria-labelledby="list-title"><div class="card-heading">
  <span class="index-badge" aria-hidden="true">02</span>
  <div><h2 id="list-title">翻大事</h2><p>搜尋，或換成時間軸、月曆、週曆、日曆來看</p></div>
</div>
<div class="stack"><form class="panel" id="search-form"><div class="field">
  <label for="q">關鍵字</label>
  <div class="input-group">
  <input id="q" type="search" placeholder="例如：機票 沖繩" autocomplete="off" spellcheck="false" enterkeyhint="search">
  <button type="submit" id="search-btn" aria-label="搜尋紀錄">搜尋</button>
</div>
  <p class="hint">比對標題、描述、類別與地點；以空白分隔多個關鍵字，全部符合才列出</p>
</div></form>
<fieldset class="segmented app-views">
  <legend class="visually-hidden">檢視方式</legend>
  <label><input type="radio" name="view" value="list" checked><span>列表</span></label>
  <label><input type="radio" name="view" value="timeline"><span>時間軸</span></label>
  <label><input type="radio" name="view" value="month"><span>月曆</span></label>
  <label><input type="radio" name="view" value="week"><span>週曆</span></label>
  <label><input type="radio" name="view" value="day"><span>日曆</span></label>
</fieldset>
<div class="app-period" id="period-bar" hidden>
  <button class="btn is-sm secondary" type="button" id="prev-btn" aria-label="上一段">←</button>
  <strong class="app-period-label" id="period-label" aria-live="polite"></strong>
  <button class="btn is-sm secondary" type="button" id="next-btn" aria-label="下一段">→</button>
  <button class="btn is-sm secondary" type="button" id="today-btn">今天</button>
</div>
<p class="app-summary" id="summary" aria-live="polite"></p>
<p class="status" id="list-status" role="status"></p>
<div class="app-view" id="view"></div>
<button hidden class="btn secondary" type="button" id="more-btn">載入更多</button></div></section></div></div>
</main>
<footer class="site-foot is-mono">花錢事件簿 · 大筆的錢、重要的事，記一筆 · © 2026 lazyjerry</footer>
</div>
<img class="jerry-mark" src="jerry.png" width="1" height="1" alt="" aria-hidden="true">
</body>
</html>
